services:
  - type: web
    name: solana-ai-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
        
