services:
  - type: worker
    name: ai-meme-trading-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.main"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WALLET_PRIVATE_KEY
        sync: false
      - key: NETWORK
        value: devnet
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_POSITION_SIZE_SOL
        value: "0.1"
      - key: MAX_DAILY_LOSS_SOL
        value: "0.3"
      - key: MAX_OPEN_POSITIONS
        value: "3"
      - key: STOP_LOSS_PERCENT
        value: "20"
      - key: TAKE_PROFIT_PERCENT
        value: "50"
      - key: SLIPPAGE_BPS
        value: "100"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./trading_bot.db"
