services:
  - type: worker
    name: ai-meme-trading-bot
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m app.main"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
